[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slop_score"
dynamic = ["version"]
description = "Deterministic complexity-erosion metrics for a Python codebase."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "sjtechdev" }]
requires-python = ">=3.9"
dependencies = [
    "radon>=6.0",
]

[project.optional-dependencies]
cognitive = ["complexipy"]
test = ["pytest"]

[project.scripts]
slopscore = "slop_score.cli:main"

[project.urls]
Homepage = "https://github.com/sjtechdev/slop_score"
Repository = "https://github.com/sjtechdev/slop_score"

[tool.setuptools.dynamic]
version = { attr = "slop_score.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
