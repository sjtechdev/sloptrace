[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sloptrace"
dynamic = ["version"]
description = "Deterministic complexity-erosion metrics for a Python codebase."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "sjtechdev" }]
requires-python = ">=3.9"
dependencies = [
    "radon>=6.0",
]

[project.optional-dependencies]
cognitive = ["complexipy"]
test = ["pytest"]

[project.scripts]
sloptrace = "sloptrace.cli:main"

[project.urls]
Homepage = "https://github.com/sjtechdev/sloptrace"
Repository = "https://github.com/sjtechdev/sloptrace"

[tool.setuptools.dynamic]
version = { attr = "sloptrace.__version__" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/sloptrace/tests"]
